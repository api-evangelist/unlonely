name: Unlonely
description: >-
  Unlonely was a crypto/web3 livestreaming platform founded by Grace and Brian Guan
  and backed by Multicoin Capital — livestreams on Base with token-gated chat,
  creator and temp tokens, the $VIBES on-chain interaction economy, and stream clips
  minted as NFCs (non-fungible clips). The product is defunct: the unlonely.app
  domain registration has expired and the hosted GraphQL API is no longer live, but
  the platform was open source and this profile preserves its real GraphQL schema
  (225 types) harvested from the public monorepo.
